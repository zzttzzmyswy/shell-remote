[package]
name = "shell-remote"
version = "0.35.0"
edition = "2021"
description = "Self-hosted collaborative remote SSH tool with MCP support"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env", "cargo"] }
portable-pty = "0.8"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
rand = "0.8"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors"] }
anyhow = "1"
thiserror = "1"
base64 = "0.22"
tokio-stream = "0.1"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
encoding_rs = "0.8"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
openh264-sys2 = { version = "0.9.8", features = ["source"] }
x11rb = { version = "0.14", features = ["image", "composite"] }
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }
tokio-tungstenite = { version = "0.23", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
futures-util = "0.3.34"
# Wayland 原生捕获（可选 feature，Linux 才有意义）: xdg-desktop-portal
# ScreenCast D-Bus 会话 + PipeWire 视频流（经 gstreamer appsink 读帧）。
zbus = { version = "3", optional = true }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
time = { version = "0.3", features = ["formatting"] }
# axum-server tls-rustls 启用 ring provider；直接依赖 rustls 以便显式 install_default
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# 默认 unwind（不用 panic=abort）：后台线程（截图线程化 capture 线程等）
# 一旦 panic 可被 catch_unwind 捕获 → 转错误上报而非闪退整个 agent 进程，
# 且崩溃日志 hook 能在 unwind 下拿到调用栈。对体积影响可忽略（MYS-886
# Windows agent 桌面闪退诊断与鲁棒性）。
panic = "unwind"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Ole"] }

[target.x86_64-pc-windows-gnu.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Foundation", "Win32_System_Threading"] }

[features]
# Wayland 原生捕获: portal + PipeWire（构建需 zbus/gstreamer 与系统的
# xdg-desktop-portal；未启用时 --desktop-capture wayland 给出可操作错误）。
wayland = ["dep:zbus", "dep:gstreamer", "dep:gstreamer-app"]
# VP9 软编（libvpx）。默认开启；若目标机没有 libvpx 静态/动态库可关闭，
# 此时 --desktop-codec vp9 会被拒绝、codecs 列表只剩 h264。
# AV1 软编（libaom）。两者并存，默认 AV1（压缩率最高的同时码率真实受控，
# 让用户要求"禁止自动降低分辨率"成立）；agent 可用 --desktop-codec 切 vp9。
default = ["vp9", "av1"]
vp9 = []
av1 = []
