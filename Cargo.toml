[package]
name = "shell-remote"
version = "0.20.3"
edition = "2021"
description = "Self-hosted collaborative remote SSH tool with MCP support"

[dependencies]
axum = { version = "0.7" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env", "cargo"] }
portable-pty = "0.8"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
rand = "0.8"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors"] }
anyhow = "1"
thiserror = "1"
base64 = "0.22"
tokio-stream = "0.1"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
encoding_rs = "0.8"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
openh264-sys2 = { version = "0.9.8", features = ["source"] }
x11rb = { version = "0.14", features = ["image", "composite"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
