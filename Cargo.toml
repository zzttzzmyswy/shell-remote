[package]
name = "shell-remote"
version = "0.53.0"
edition = "2021"
description = "Self-hosted collaborative remote SSH tool with MCP support"

[lib]
name = "shell_remote"
path = "src/lib.rs"

[[bin]]
name = "shell-remote"
path = "src/main.rs"

# UI 二进制：仅 agent 模式（终端 + 桌面转发）。依赖 desktop feature 的
# 桌面编码/捕获/lan/p2p 代码，构建时必须带上 --features desktop（default
# features 已含）；lean 构建（--no-default-features）时 cargo 自动跳过该 bin。
[[bin]]
name = "shell-remote-ui"
path = "src/bin/shell-remote-ui.rs"
required-features = ["desktop", "tui", "gui"]

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env", "cargo"] }
portable-pty = "0.8"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
rand = "0.8"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tower-http = { version = "0.5", features = ["cors"] }
anyhow = "1"
thiserror = "1"
base64 = "0.22"
tokio-stream = "0.1"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
encoding_rs = "0.8"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
# 桌面转发依赖（仅 desktop feature 编译，UI 二进制用）。CLI 二进制 lean
# 构建（--no-default-features）完全不引入这些重依赖。
openh264-sys2 = { version = "0.9.8", features = ["source"], optional = true }
x11rb = { version = "0.14", features = ["image", "composite", "shm", "randr"], optional = true }
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"], optional = true }
tokio-tungstenite = { version = "0.23", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
futures-util = "0.3.34"
# Wayland 原生捕获（可选 feature，Linux 才有意义）: xdg-desktop-portal
# ScreenCast D-Bus 会话 + PipeWire 视频流（经 gstreamer appsink 读帧）。
zbus = { version = "3", optional = true }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
time = { version = "0.3", features = ["formatting"] }
# axum-server tls-rustls 启用 ring provider；直接依赖 rustls 以便显式 install_default
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
str0m = { version = "0.23.1", default-features = false, features = ["rust-crypto"], optional = true }
# 终端状态界面（TUI，仅 tui feature）：纯 Rust 终端渲染，无系统依赖，
# 保持现有 musl 静态多架构交叉编译不变。UI 二进制 agent 模式带 TTY 时显示。
ratatui = { version = "0.30", optional = true }
# 原生窗口 GUI（eframe/egui，glow 渲染 + X11 纯 Rust 协议 x11rb）：
# libxkbcommon/libGL 运行时 dlopen，产物保持 musl 全静态
# （aarch64/armv7 需 -ldl 空 stub，见 tools/build-dist.sh）。
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11"], optional = true }

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# 默认 unwind（不用 panic=abort）：后台线程（截图线程化 capture 线程等）
# 一旦 panic 可被 catch_unwind 捕获 → 转错误上报而非闪退整个 agent 进程，
# 且崩溃日志 hook 能在 unwind 下拿到调用栈。对体积影响可忽略（MYS-886
# Windows agent 桌面闪退诊断与鲁棒性）。
panic = "unwind"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Ole"], optional = true }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target.x86_64-pc-windows-gnu.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"], optional = true }

[features]
# 默认带桌面：与旧版单一二进制行为一致（cargo build / cargo test 全量）。
# CLI 二进制发布产物用 --no-default-features 构建 → 不编译任何桌面代码。
default = ["desktop", "av1", "tui", "gui"]
# 桌面转发（UI 二进制）：X11/DXGI/GDI/wayland 捕获 + AV1/H264 软编 +
# WebRTC P2P + LAN 直连。关闭时整个 src/agent/desktop、lan、p2p 不编译。
desktop = ["dep:openh264-sys2", "dep:x11rb", "dep:enigo", "dep:str0m", "dep:windows-sys", "dep:windows"]
# AV1 软编（libaom），默认编进桌面构建（build.rs 链接系统/静态 libaom）。
av1 = []
# 终端状态界面（ratatui）：UI 二进制带 TTY 时渲染状态面板。
tui = ["dep:ratatui"]
# 原生窗口面板（eframe，仅 UI 二进制）。
gui = ["dep:eframe", "tui"]
# Wayland 原生捕获: portal + PipeWire（构建需 zbus/gstreamer 与系统的
# xdg-desktop-portal；未启用时 --desktop-capture wayland 给出可操作错误）。
# 桌面代码被 desktop feature 门控，wayland 依赖桌面编译。
wayland = ["desktop", "dep:zbus", "dep:gstreamer", "dep:gstreamer-app"]
