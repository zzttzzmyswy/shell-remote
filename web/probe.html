<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>MSE 探针</title>
<style>body{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#111;color:#ddd;padding:16px;white-space:pre-wrap;word-break:break-all}
input{background:#222;color:#eee;border:1px solid #555;padding:4px 6px;width:200px}
button{background:#2a6;color:#fff;border:0;padding:5px 12px;cursor:pointer}
.bad{color:#f77}.ok{color:#7d7}</style></head>
<body>MSE 自诊断（Token:
<input id="tok" value="testkey">
<button onclick="run()">开始</button>）
<pre id="out">等待…</pre>
<script>
const $ = id => document.getElementById(id);
const out = [];
function log(s, cls){ out.push('<span class="'+(cls||'')+'">'+s.replace(/</g,'&lt;')+'</span>'); $('out').innerHTML = out.join('\n'); }
function hex2(c){ return c.toString(16).padStart(2,'0').toUpperCase(); }

async function probeOnce(codec, token, tag) {
  return new Promise(async (resolve) => {
    const ms = new MediaSource();
    const v = document.createElement('video');
    v.muted = true; v.autoplay = true; v.playsInline = true;
    document.body.appendChild(v);
    v.src = URL.createObjectURL(ms);
    let sb = null, done = false, firstInit = null;
    const fin = (msg) => { if(done) return; done = true; try{ URL.revokeObjectURL(v.src);}catch(e){} v.remove(); resolve(msg); };
    const t0 = Date.now();
    const timer = setInterval(() => {
      let extra = '';
      if (sb && sb.buffered && sb.buffered.length) {
        const s0 = sb.buffered.start(0);
        // 实时流对齐: 首帧 pts 可能非 0, 播放头需 seek 到缓冲起点
        if (v.currentTime < s0 - 0.05) v.currentTime = s0;
        extra = ' buf['+sb.buffered.start(0).toFixed(2)+','+sb.buffered.end(0).toFixed(2)+']';
      }
      log('  ['+tag+'] t='+v.currentTime.toFixed(2)+extra, '');
      if (Date.now()-t0 > 6000) { clearInterval(timer); fin('timeout(6s) currentTime='+v.currentTime.toFixed(2)); }
    }, 700);
    v.addEventListener('error', () => {
      const m = v.error;
      log('  ['+tag+'] video error code='+(m&&m.code)+' '+(m&&m.message), 'bad');
    });
    ms.addEventListener('sourceopen', () => {
      try { sb = ms.addSourceBuffer('video/mp4; codecs="'+codec+'"'); }
      catch(e){ clearInterval(timer); fin('addSourceBuffer error: '+e.message); return; }
      sb.addEventListener('error', () => log('  ['+tag+'] SourceBuffer ERROR', 'bad'));
      sb.addEventListener('updateend', () => { pump(); });
      const q = firstInit ? [firstInit] : [];
      let appending = false;
      const pump = () => {
        if (appending || q.length === 0) return;
        appending = true;
        const d = q.shift();
        try { sb.appendBuffer(d); } catch(e){ log('  ['+tag+'] append error '+e.name, 'bad'); }
        appending = false;
        if (q.length) setTimeout(pump, 0);
      };
      (async () => {
        const resp = await fetch('/agent/desktop/stream', { headers: { 'Authorization':'Bearer '+token } });
        if (!resp.ok || !resp.body) { clearInterval(timer); fin('stream HTTP '+resp.status); return; }
        const reader = resp.body.getReader();
        const r = await reader.read();
        if (r.done || !r.value) { clearInterval(timer); fin('no data'); return; }
        firstInit = r.value.buffer.slice(r.value.byteOffset, r.value.byteOffset+r.value.byteLength);
        q.push(firstInit);
        pump();
        (async () => {
          let n = 0;
          while (n < 60) {
            const x = await reader.read();
            if (x.done) break;
            q.push(x.value.buffer.slice(x.value.byteOffset, x.value.byteOffset+x.value.byteLength));
            pump();
            n++;
          }
        })();
      })();
    });
    v.addEventListener('playing', () => { if(!done){ log('  ['+tag+'] PLAYING', 'ok'); clearInterval(timer); fin('playing'); } });
  });
}

function codecFromInit(buf){
  const u8 = new Uint8Array(buf);
  for(let i=0;i<u8.length-4;i++){
    if(u8[i]===0x61&&u8[i+1]===0x76&&u8[i+2]===0x63&&u8[i+3]===0x43)
      return 'avc1.'+hex2(u8[i+5])+hex2(u8[i+6])+hex2(u8[i+7]);
  }
  return null;
}

async function ensureStream(token){
  // 若桌面流不在运行(404), 用该 token 触发 desktop:start 后重试
  for (let attempt=0; attempt<2; attempt++){
    const resp = await fetch('/agent/desktop/stream', { headers: {'Authorization':'Bearer '+token} });
    if (resp.ok) return resp;
    log('stream HTTP '+resp.status + (attempt===0 ? ' → 触发 desktop:start…' : ''));
    if (resp.status===404 && attempt===0){
      await fetch('/agent/session/send', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token, type:'desktop:start', payload:{} })
      });
      await new Promise(r=>setTimeout(r,2000));
    } else return resp;
  }
  return null;
}

async function run(){
  $('out').innerHTML = ''; out.length = 0;
  const token = $('tok').value.trim() || 'testkey';
  log('UA: '+navigator.userAgent);
  log('MSE='+(typeof MediaSource!=='undefined')+' webcodecs='+(typeof VideoDecoder!=='undefined'));
  const cands = ['avc1.42C028','avc1.42E01E','avc1.64001E','avc1.640028','vp09.00.10.08'];
  for (const c of cands) {
    log('isTypeSupported('+c+') = '+MediaSource.isTypeSupported('video/mp4; codecs="'+c+'"'));
  }
  // 确保桌面流在跑(404 时自动 desktop:start)并抓 init
  const resp = await ensureStream(token);
  if(!resp){ log('stream 不可用(两次尝试后仍非 200)', 'bad'); return; }
  const reader = resp.body.getReader();
  const r0 = await reader.read();
  const init = r0.value.buffer.slice(r0.value.byteOffset, r0.value.byteOffset+r0.value.byteLength);
  const real = codecFromInit(init);
  log('init '+init.byteLength+'B 解析真实 codec='+real);
  reader.cancel();
  // 用真实 codec 试播；若失败再试 42E01E（低 level）对照
  const order = [];
  if (real) order.push(real);
  if (!order.includes('avc1.42E01E')) order.push('avc1.42E01E');
  order.push('avc1.640028');
  for (const c of order.slice(0,3)) {
    log('— 尝试 codec '+c);
    const msg = await probeOnce(c, token, c);
    log('  结果: '+msg, msg==='playing'?'ok':'bad');
    if (msg==='playing') break;
  }
}
</script></body></html>
